# Source: application/templates/extraobjects.yaml
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  labels:
    app.kubernetes.io/instance: service-1
    app.kubernetes.io/name: service-1
  name: service-1
  annotations: null
spec:
  maxReplicaCount: 3
  minReplicaCount: 1
  scaleTargetRef:
    name: service-1
  triggers:
    - metadata:
        metricName: istio_rps_1m
        query: |
          sum(rate(istio_requests_total{
            reporter="destination",
            destination_workload_namespace="service-1",
            destination_workload="service-1",
          }[1m]))
        serverAddress: http://kps-prometheus.monitoring.svc.cluster.local:9090
        threshold: "75"
        annotations: null
        labels: null
      type: prometheus
