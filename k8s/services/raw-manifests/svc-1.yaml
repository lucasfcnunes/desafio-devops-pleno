# Source: application/templates/extraobjects.yaml
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  labels:
    app.kubernetes.io/instance: service-1
    app.kubernetes.io/name: service-1
  name: service-1-external-route
  annotations: null
spec:
  gateways:
    - service-1-gateway
  hosts:
    - service-1.desafio-devops.local
    - service-1.desafio-devops.lucasfcnunes.com
  http:
    - match:
        - uri:
            regex: /service-2(/|$)(.*)
      rewrite:
        uriRegexRewrite:
          match: /service-2(/|$)(.*)
          rewrite: /\2
      route:
        - destination:
            host: service-2.service-2.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            regex: /service-1(/|$)(.*)
      rewrite:
        uriRegexRewrite:
          match: /service-1(/|$)(.*)
          rewrite: /\2
      route:
        - destination:
            host: service-1.service-1.svc.cluster.local
            port:
              number: 80
