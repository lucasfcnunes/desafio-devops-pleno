apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-1
  namespace: service-1
  labels:
    app.kubernetes.io/name: service-1
    app.kubernetes.io/instance: service-1
  annotations:
---
# Source: application/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-1-mappings-data
  namespace: service-1
  labels:
    app.kubernetes.io/name: service-1
    app.kubernetes.io/instance: service-1
  annotations: null
data:
  mappings.json: |

    {
      "mappings": [
        {
          "priority": 1,
          "request": {
            "urlPathPattern": "/(service-\\d+)(/|$)(.*)"
          },
          "response": {
            "proxyBaseUrl": "http://{{request.pathSegments.[0]}}.{{request.pathSegments.[0]}}.svc.cluster.local",
            "proxyUrlPrefixToRemove": "/{{request.pathSegments.[0]}}"
          }
        },
        {
          "priority": 10,
          "request": {
            "urlPathPattern": ".*"
          },
          "response": {
            "status": 200,
            "body": "{\n  \"wiremock\": {\n    \"serverTime\": \"{{now format='yyyy-MM-dd HH:mm:ssZ'}}\",\n    \"epoch\": {{now format='epoch'}},\n    \"hostname\": \"{{systemValue type='ENVIRONMENT' key='HOSTNAME'}}\",\n    \"javaVersion\": \"{{systemValue type='PROPERTY' key='java.version'}}\"\n  },\n  \"request\": {\n    \"method\": \"{{request.method}}\",\n    \"url\": \"{{request.url}}\",\n    \"protocol\": \"{{request.protocol}}\",\n    \"clientIp\": \"{{request.clientIp}}\",\n    \"headers\": {{{toJson request.headers}}},\n    \"queryParams\": {{#if request.queryParams}}{{{toJson request.queryParams}}}{{else}}{}{{/if}},\n    \"body\": {{#if request.body}}{{{request.body}}}{{else}}null{{/if}}\n  }\n}\n",
            "headers": {
              "Content-Type": "application/json"
            }
          }
        }
      ]
    }
---
# Source: application/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: service-1
  namespace: service-1
  labels:
    app.kubernetes.io/name: service-1
    app.kubernetes.io/instance: service-1
  annotations: null
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service-1
    application.stakater.com/workload-class: serving
  ports:
    - appProtocol: http
      name: http
      port: 80
      targetPort: http
---
# Source: application/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: service-1
    app.kubernetes.io/instance: service-1
  annotations:
    reloader.stakater.com/auto: "true"
  name: service-1
  namespace: service-1
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: service-1
      application.stakater.com/workload-class: serving
  strategy:
    type: RollingUpdate
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-1
        app.kubernetes.io/instance: service-1
        application.stakater.com/workload-class: serving
      annotations: null
    spec:
      automountServiceAccountToken: true
      serviceAccountName: service-1
      enableServiceLinks: true
      containers:
        - name: service-1
          image: wiremock/wiremock:3.13.2
          imagePullPolicy: IfNotPresent
          args:
            - --port=3000
            - --global-response-templating
            - --root-dir=/home/wiremock/storage
            - --permitted-system-keys=.*
            - --disable-gzip
            - --verbose
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          volumeMounts:
            - name: mappings-data
              mountPath: /home/wiremock/storage/mappings
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
      volumes:
        - name: mappings-data
          configMap:
            name: service-1-mappings-data
      terminationGracePeriodSeconds:
